                  for l in lines[idx:idx + 40]:
                      if re.search(r'\b[Aa]ssume\w*\.\w+\(|\bassume(True|False|That)\(', l):
                          notes.append('assumption: ' + l.strip())
                          break
              simple = cls.split('.')[-1].split('$')[-1]
              cidx = next((i for i, l in enumerate(lines)
                           if re.search(r'\bclass\s+' + re.escape(simple) + r'\b', l)), None)
              if cidx is not None:
                  cls_notes = [n for n in block_above(lines, cidx) if n.startswith('@')]
                  notes += ['class-level ' + n for n in cls_notes]
              return notes


          t = f = e = s = 0
          for p in sorted(glob.glob('engine/target/surefire-reports/TEST-*.xml')):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is None:
                      continue
