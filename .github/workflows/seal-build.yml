name: Seal build camunda-engine

# Upstream builds and tests on Jenkins (Jenkinsfile + .ci/config); none of the
# GitHub workflows it ships build or test. This workflow mirrors the Jenkins
# release build (JDK 17, profile h2-in-memory, mvn install) for the engine
# module and the "db-unit" h2 engine unit-test stage, sharded across jobs using
# the engine pom's own test.includes / test.excludes regex properties.
#
# The engine jar shades Gson 2.8.9, which has no JsonReader nesting limit
# (CVE-2025-53864 / sonatype-2025-000535). .seal/install-sealed-deps.sh builds
# Gson 2.8.9 with the sealed nesting-limit patch (.seal/gson/CVE-2025-53864.patch)
# and installs it into the local Maven repository before the engine build in
# every job; .seal/verify-sealed-deps.sh checks the built engine jar in the build
# job. JDK 11 is set up ahead of JDK 17 because Gson 2.8.9 does not compile on 17.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Surefire -Dtest selector; empty runs the full engine suite'
        required: false
        default: ''

env:
  MAVEN_OPTS: -Xmx3g
  # The 7.20 engine suite assumes Camunda's CI time zone: StartTimerEventTest's
  # *WithDate cycles and HistoryCleanupScheduler*Test.shouldScheduleToLater
  # (batch window "13:00" vs a 12:00 UTC clock) fail on the runner's UTC.
  TZ: Europe/Berlin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11 (compiles Gson 2.8.9)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven 3.9.5
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.5
      - name: Install sealed Gson 2.8.9 (nesting limit, CVE-2025-53864)
        run: bash .seal/install-sealed-deps.sh
      - name: Build camunda-engine artifacts
        run: mvn -B -V install -pl engine -am -Ph2-in-memory -DskipTests
      - name: Verify the shaded Gson in the engine jar has the nesting limit
        run: bash .seal/verify-sealed-deps.sh
      - name: Run selected tests
        if: ${{ inputs.test-filter != '' }}
        env:
          FILTER: ${{ inputs.test-filter }}
        run: mvn -B verify -pl engine -Ph2-in-memory -Dtest="${FILTER// /,}" -Dsurefire.failIfNoSpecifiedTests=false
      - name: Print test summary and skipped tests (with skip reasons from surefire or test source)
        if: ${{ always() && inputs.test-filter != '' }}
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys
          import xml.etree.ElementTree as ET

          SRC = 'engine/src/test/java'
          UNINFORMATIVE = re.compile(r'^\s*$|^got: ')


          def block_above(lines, idx):
              out, j = [], idx - 1
              while j >= 0:
                  s = lines[j].strip()
                  if not s or s.endswith('}') or (s.endswith(';') and not s.startswith(('*', '//'))):
                      break
                  out.insert(0, s)
                  j -= 1
              keep = []
              for s in out:
                  if re.match(r'@(Ignore|Disabled|Required\w*)\b', s):
                      keep.append(s)
                  elif s.startswith(('//', '*', '/*')) and s.strip('/* ') and '@author' not in s and not s.startswith('* @'):
                      keep.append(s.lstrip('/* ').rstrip())
              return keep


          def source_reason(cls, name):
              top = cls.split('$')[0]
              path = os.path.join(SRC, top.replace('.', '/') + '.java')
              if not os.path.exists(path):
                  return []
              lines = open(path, encoding='utf-8', errors='replace').read().split('\n')
              notes = []
              meth = re.sub(r'\[.*$', '', name or '')
              idx = next((i for i, l in enumerate(lines)
                          if re.search(r'\bvoid\s+' + re.escape(meth) + r'\s*\(', l)), None) if meth else None
              if idx is not None:
                  notes += block_above(lines, idx)
                  for l in lines[idx:idx + 40]:
                      if re.search(r'\b[Aa]ssume\w*\.\w+\(|\bassume(True|False|That)\(', l):
                          notes.append('assumption: ' + l.strip())
                          break
              simple = cls.split('.')[-1].split('$')[-1]
              cidx = next((i for i, l in enumerate(lines)
                           if re.search(r'\bclass\s+' + re.escape(simple) + r'\b', l)), None)
              if cidx is not None:
                  cls_notes = [n for n in block_above(lines, cidx) if n.startswith('@')]
                  notes += ['class-level ' + n for n in cls_notes]
              return notes


          t = f = e = s = 0
          for p in sorted(glob.glob('engine/target/surefire-reports/TEST-*.xml')):
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is None:
                      continue
                  cls, name = tc.get('classname'), tc.get('name')
                  msg = (sk.get('message') or '').strip()
                  parts = []
                  if msg and not UNINFORMATIVE.match(msg):
                      parts.append('@Ignore/skip message: ' + msg)
                  src = source_reason(cls, name)
                  if src:
                      if all(n in ('@Ignore', 'class-level @Ignore') for n in src):
                          src = src + ['disabled upstream by a bare @Ignore (no reason text in source)']
                      parts.append('source: ' + ' | '.join(src))
                  if msg and UNINFORMATIVE.match(msg):
                      parts.append('surefire: ' + msg)
                  if not parts:
                      parts.append('no reason recorded by surefire or in source annotations')
                  reason = '; '.join(parts)
                  if len(reason) > 200:  # keep the whole listing inside the log tail
                      reason = reason[:197] + '...'
                  print(f"SKIPPED: {cls}.{name} -- {reason}")
          print(f"SUMMARY: tests={t} passed={t-f-e-s} failures={f} errors={e} skipped={s}")
          EOF
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camunda-engine
          if-no-files-found: error
          path: |
            ~/.m2/repository/org/camunda/bpm/camunda-engine/7.20.0/camunda-engine-7.20.0.jar
            ~/.m2/repository/org/camunda/bpm/camunda-engine/7.20.0/camunda-engine-7.20.0-tests.jar

  test:
    if: ${{ inputs.test-filter == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: api-runtime-task-repository-identity-externaltask
            args: "-Dtest.includes=engine/test/api/(runtime|task|repository|identity|externaltask)/"
          - shard: api-authorization-multitenancy
            args: "-Dtest.includes=engine/test/api/(authorization|multitenancy)/"
          - shard: bpmn-cmmn
            args: "-Dtest.includes=engine/test/(bpmn|cmmn)/"
          - shard: remainder
            args: "-Dtest.excludes=engine/test/api/(runtime|task|repository|identity|externaltask|authorization|multitenancy)/|engine/test/(bpmn|cmmn)/"
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11 (compiles Gson 2.8.9)
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven 3.9.5
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.5
      - name: Install sealed Gson 2.8.9 (nesting limit, CVE-2025-53864)
        run: bash .seal/install-sealed-deps.sh
      - name: Install engine dependencies
        run: mvn -B -V install -pl engine -am -DskipTests
      - name: Engine unit tests (h2)
        run: mvn -B verify -pl engine -Ph2-in-memory '${{ matrix.args }}'
      - name: Print test summary and skipped tests (with skip reasons from surefire or test source)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys
          import xml.etree.ElementTree as ET

          SRC = 'engine/src/test/java'
          UNINFORMATIVE = re.compile(r'^\s*$|^got: ')


